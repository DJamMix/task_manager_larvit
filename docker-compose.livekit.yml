# LiveKit — для локальной разработки групповых звонков
# Запуск: docker compose -f docker-compose.livekit.yml up -d
# В .env:
#   LIVEKIT_URL=ws://127.0.0.1:7880
#   LIVEKIT_API_KEY=devkey
#   LIVEKIT_API_SECRET=secretsecretsecretsecretsecretsecret00
#
# На проде нужен wss:// и TURN (для пользователей за NAT).

services:
  livekit:
    image: livekit/livekit-server:latest
    command: --dev --bind 0.0.0.0
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    environment:
      LIVEKIT_KEYS: "devkey: secretsecretsecretsecretsecretsecret00"
